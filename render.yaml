# Render Blueprint. Deploy with: render blueprint launch (or connect the repo
# in the Render dashboard and it will pick this up).
#
# Plan note: `starter` is $7/mo with 512 MB. The free plan spins down after 15
# minutes of inactivity with a ~60 s cold start, which conflicts with the
# brief's requirement that the deployment stay available through the evaluation
# period - so free is not used even though the image would fit it.
services:
  - type: web
    name: autoace-voice-tone
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: state
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      # Secrets are set in the Render dashboard, never committed.
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USER
        value: autoace
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_MODEL_FALLBACK
        value: gemini-3.1-flash-lite
      - key: GEMINI_THINKING_BUDGET
        value: "0"
      - key: LOCAL_ONLY
        value: "false"
      - key: UPLOAD_RETENTION_HOURS
        value: "24"
      - key: MAX_CONCURRENCY
        value: "4"
      - key: PYTHONUNBUFFERED
        value: "1"

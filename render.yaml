# Render Blueprint. Deploy with: render blueprint launch (or connect the repo
# in the Render dashboard and it will pick this up).
#
# PLAN: currently `free`, which is what the account can create without a card
# on file. Measured peak RSS is 60 MB, so 512 MB is ample either way.
#
# Before handing the URL to a reviewer, change this to `starter` ($7/mo, same
# 512 MB). The free plan spins down after 15 minutes of inactivity with a ~60 s
# cold start, which conflicts with the brief's requirement that the deployment
# remain available through the evaluation period. Upgrading requires adding a
# payment method in the Render dashboard.
#
# No disk is mounted. Staged audio is deliberately ephemeral - it is deleted
# when a batch finishes anyway, and ephemeral storage means it cannot survive a
# restart either. The trade-off is that prediction results are lost on redeploy;
# results are downloadable as CSV/JSON, so that is acceptable.
services:
  - type: web
    name: autoace-voice-tone
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secrets are set in the Render dashboard, never committed.
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USER
        value: autoace
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_THINKING_BUDGET
        value: "0"
      - key: LOCAL_ONLY
        value: "false"
      - key: UPLOAD_RETENTION_HOURS
        value: "24"
      # 1, not 4: a 172-second clip peaks at 332 MB through all four paths and
      # the instance limit is 512 MiB (536.9 MB), so two of them in flight can
      # exceed it. The service was already OOM-killed once at concurrency 4,
      # before the memory work (single-pass features, float32 frames, batched F0
      # FFT, no ONNX arena) brought the peak down from 637 MB.
      #
      # Throughput barely suffers: the free plan allocates 0.1 CPU and Paths B/C/D
      # are CPU-bound, so extra concurrency mostly queues on the same core. On a
      # larger instance raise this together with the memory, not on its own.
      - key: MAX_CONCURRENCY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
